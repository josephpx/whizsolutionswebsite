<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Product Tour: Whiz ServiceOps | Run a Service Call End to End</title>
<meta name="description" content="Try ServiceOps in 2 minutes: take one service request from customer click to dispatch, GPS tracking, digital sign-off, work report and invoice. Interactive demo with sample data, by Whiz Solutions, Dubai." />
<link rel="canonical" href="https://www.whizsolutions.net/serviceops/tour/" />
<meta name="robots" content="index, follow" />
<meta property="og:title" content="ServiceOps Interactive Product Tour" />
<meta property="og:description" content="Operate a real service workflow (request, dispatch, field work, signature, report, invoice) in under 2 minutes." />
<meta property="og:url" content="https://www.whizsolutions.net/serviceops/tour/" />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#2457FF" />
<link rel="icon" href="/favicon-32.png" />
<style>
/* ============================================================
   ServiceOps Interactive Tour — design system
   Matches the ServiceOps page: white, blue #2457FF, orange CTA,
   purple AI accents, rounded cards, soft shadows.
   ============================================================ */
:root {
  --blue: #2457FF; --blue-dk: #1B43CC; --blue-soft: #EEF3FF; --blue-mid: #4F79FF;
  --orange: #F97316; --orange-dk: #EA580C;
  --purple: #7C3AED; --purple-soft: #F3EDFF;
  --green: #059669; --green-soft: #ECFDF5;
  --amber: #D97706; --amber-soft: #FEF3C7;
  --ink: #16213E; --body: #3D4A66; --mute: #7C879E;
  --line: #E2E8F0; --surface: #F6F8FB; --white: #FFFFFF;
  --r-card: 16px; --r-btn: 10px;
  --shadow-sm: 0 1px 2px rgba(22,33,62,.06), 0 4px 12px rgba(22,33,62,.05);
  --shadow-md: 0 2px 6px rgba(22,33,62,.07), 0 16px 40px -12px rgba(22,33,62,.14);
  --shadow-lg: 0 4px 12px rgba(22,33,62,.08), 0 32px 70px -20px rgba(22,33,62,.25);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--surface); color: var(--ink); font-family: var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
img, svg { display: block; }

.tour-root { min-height: 100vh; display: flex; flex-direction: column;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(36,87,255,.07), transparent 60%),
    radial-gradient(800px 400px at 88% 0%, rgba(124,58,237,.06), transparent 60%),
    var(--surface); }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* ---------- type ---------- */
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }
.kicker .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--orange); }
.h1 { font-size: clamp(28px, 4.2vw, 44px); line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
.h1 .grad { background: linear-gradient(92deg, var(--blue), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--body); font-size: 16.5px; line-height: 1.65; }
.small { font-size: 12.5px; color: var(--mute); }
.mono { font-family: var(--mono); }

/* ---------- buttons ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; border-radius: var(--r-btn); font-weight: 700; font-size: 14.5px; padding: 12px 22px;
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease; user-select: none; }
.btn:active { transform: scale(.97); }
.btn-blue { background: var(--blue); color: #fff; box-shadow: 0 8px 20px -8px rgba(36,87,255,.55); }
.btn-blue:hover { background: var(--blue-dk); }
.btn-orange { background: linear-gradient(180deg, var(--orange), var(--orange-dk)); color: #fff;
  box-shadow: 0 10px 24px -8px rgba(234,88,12,.55); }
.btn-orange:hover { filter: brightness(1.06); }
.btn-outline { border: 1.5px solid var(--line); background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }
.btn-outline:hover { border-color: var(--blue-mid); color: var(--blue); }
.btn-ghost { color: var(--body); font-weight: 600; }
.btn-ghost:hover { color: var(--blue); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .ripple { position: absolute; border-radius: 99px; transform: scale(0); background: rgba(255,255,255,.5);
  animation: ripple .55s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(3.2); opacity: 0; } }
.pulse { animation: pulse 1.7s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(36,87,255,.38), 0 8px 20px -8px rgba(36,87,255,.55); }
  55% { box-shadow: 0 0 0 12px rgba(36,87,255,0), 0 8px 20px -8px rgba(36,87,255,.55); } }
.pulse-orange { animation: pulseO 1.7s ease-in-out infinite; }
@keyframes pulseO { 0%,100% { box-shadow: 0 0 0 0 rgba(249,115,22,.4), 0 10px 24px -8px rgba(234,88,12,.55); }
  55% { box-shadow: 0 0 0 12px rgba(249,115,22,0), 0 10px 24px -8px rgba(234,88,12,.55); } }

/* ---------- cards & chips ---------- */
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-sm); }
.card-md { box-shadow: var(--shadow-md); }
.glass { background: rgba(255,255,255,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(226,232,240,.9); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 4px 11px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.chip .cdot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.chip-amber { background: var(--amber-soft); color: var(--amber); }
.chip-blue { background: var(--blue-soft); color: var(--blue); }
.chip-purple { background: var(--purple-soft); color: var(--purple); }
.chip-green { background: var(--green-soft); color: var(--green); }
.chip-orange { background: #FFF1E7; color: var(--orange-dk); }
.chip-grey { background: var(--surface); color: var(--mute); }
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 99px;
  font-weight: 800; color: #fff; flex: none; }

/* ---------- browser frame ---------- */
.browser { border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
  box-shadow: var(--shadow-lg); background: #fff; }
.browser-bar { display: flex; align-items: center; gap: 12px; padding: 11px 16px;
  background: linear-gradient(180deg, #FBFCFE, #F3F6FB); border-bottom: 1px solid var(--line); }
.bdots { display: flex; gap: 6px; }
.bdots span { width: 11px; height: 11px; border-radius: 99px; }
.url { flex: 1; max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 7px;
  background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
  font-size: 12.5px; color: var(--body); font-family: var(--mono); }
.browser-body { position: relative; min-height: 520px; background: var(--surface); }
@media (max-width: 760px) { .browser-body { min-height: 560px; } }

/* ---------- app chrome inside browser ---------- */
.appbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #fff;
  border-bottom: 1px solid var(--line); }
.applogo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14.5px; }
.applogo .mark { width: 24px; height: 24px; border-radius: 7px;
  background: linear-gradient(135deg, var(--blue), var(--purple)); display: flex; align-items: center;
  justify-content: center; color: #fff; font-size: 12px; font-weight: 800; }
.sidebar { width: 52px; background: #fff; border-right: 1px solid var(--line); padding: 12px 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sideic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center;
  justify-content: center; font-size: 15px; color: var(--mute); }
.sideic.on { background: var(--blue-soft); color: var(--blue); }

/* ---------- progress / nav ---------- */
.progress-row { display: flex; align-items: center; gap: 14px; }
.pbar { flex: 1; height: 6px; border-radius: 99px; background: #E7ECF5; overflow: hidden; }
.pbar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--purple)); }
.navbar { display: flex; align-items: center; gap: 10px; }

/* ---------- tables / kv ---------- */
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--mute); font-weight: 600; }
.kv dd { color: var(--ink); font-weight: 600; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.trow:last-child { border-bottom: 0; }

/* ---------- phone ---------- */
.phone { width: 264px; border-radius: 36px; background: #0F172A; padding: 10px; box-shadow: var(--shadow-lg); }
.phone-screen { border-radius: 27px; overflow: hidden; background: linear-gradient(165deg, #EEF3FF, #F6F8FB 45%, #F3EDFF);
  height: 500px; position: relative; }
.notch { width: 90px; height: 22px; background: #0F172A; border-radius: 0 0 14px 14px; margin: 0 auto; }

/* ---------- signature ---------- */
.sigpad { border: 1.5px dashed #C6D2E8; border-radius: 12px; background: #FDFEFF; }

/* ---------- doc (report / invoice) ---------- */
.doc { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-md); }
.stamp { border: 3px solid var(--green); color: var(--green); font-weight: 800; letter-spacing: .12em;
  padding: 4px 14px; border-radius: 8px; font-size: 13px; text-transform: uppercase; background: rgba(236,253,245,.85); }

/* ---------- misc ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.shimmer { position: relative; overflow: hidden; }
.shimmer::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%);
  animation: shim 1.4s ease infinite; }
@keyframes shim { from { transform: translateX(-100%);} to { transform: translateX(100%);} }
.hint { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--purple); }
.scrollfade { overflow-y: auto; max-height: 100%; }
@media (max-width: 860px) {
  .grid2 { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 88px 1fr; }
  /* step layouts are two-column via inline styles — force single column on mobile */
  .s1grid { grid-template-columns: 1fr !important; }
  .navbar { flex-wrap: wrap; justify-content: center !important; row-gap: 10px; }
  .progress-row { flex-wrap: wrap; row-gap: 8px; }
  .url { font-size: 11px; }
}
@media (max-width: 480px) {
  .btn { padding: 11px 16px; font-size: 13.5px; }
  .wrap { padding: 0 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse, .pulse-orange, .shimmer::after { animation: none !important; }
}

</style>
</head>
