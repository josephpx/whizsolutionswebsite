<link rel="canonical" href="https://www.whizsolutions.net/egnyte/tour/" />

<style>
/* ============================================================
   Egnyte AI Tour — Whiz brand theme: black + neon orange.
   Same design language as whizsolutions.net and WhizFleet.
   Variable names kept from the tour engine; values re-mapped:
   --blue = primary accent (neon orange), --purple = AI accent.
   ============================================================ */
:root {
  --blue: #FF6B2B; --blue-dk: #E05A1C; --blue-soft: rgba(255,107,43,.14); --blue-mid: #FF8C42;
  --orange: #FF6B2B; --orange-dk: #CC4A10;
  --purple: #FFA35C; --purple-soft: rgba(255,163,92,.13);
  --green: #34D399; --green-soft: rgba(52,211,153,.12);
  --amber: #F5B14C; --amber-soft: rgba(245,177,76,.14);
  --ink: #F2F2F2; --body: #C9CDD4; --mute: #A0A6AE;
  --line: rgba(255,255,255,.11); --surface: #0C0C0D; --white: #151517;
  --card: #151517; --card2: #1B1B1E;
  --r-card: 16px; --r-btn: 10px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.5), 0 6px 16px rgba(0,0,0,.35);
  --shadow-md: 0 2px 8px rgba(0,0,0,.55), 0 20px 44px -12px rgba(0,0,0,.6);
  --shadow-lg: 0 4px 14px rgba(0,0,0,.6), 0 36px 80px -20px rgba(0,0,0,.75);
  --font: 'Figtree', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: 'Nohemi', 'Figtree', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--surface); color: var(--ink); font-family: var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
img, svg { display: block; }

.tour-root { min-height: 100vh; display: flex; flex-direction: column;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(255,107,43,.10), transparent 60%),
    radial-gradient(800px 400px at 88% 0%, rgba(255,107,43,.05), transparent 60%),
    var(--surface); }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* ---------- type (sizes bumped ~10% site-wide) ---------- */
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--blue-mid); font-family: var(--font-display); }
.kicker .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--blue); }
.h1 { font-size: clamp(30px, 4.4vw, 48px); line-height: 1.08; font-weight: 800; letter-spacing: -0.02em;
  font-family: var(--font-display); color: #fff; }
.h1 .grad { background: linear-gradient(92deg, #FF6B2B, #FFB27A); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--body); font-size: 17px; line-height: 1.7; }
.small { font-size: 13px; color: var(--mute); }
.mono { font-family: var(--mono); }
b, strong { color: var(--ink); }

/* ---------- buttons ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; border-radius: var(--r-btn); font-weight: 700; font-size: 15px; padding: 12px 22px;
  font-family: var(--font-display);
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease; user-select: none; }
.btn:active { transform: scale(.97); }
.btn-blue { background: var(--blue); color: #1A0A00; box-shadow: 0 8px 22px -8px rgba(255,107,43,.6); }
.btn-blue:hover { background: var(--blue-mid); }
.btn-orange { background: linear-gradient(180deg, #FF7B3D, #E05A1C); color: #fff;
  box-shadow: 0 10px 26px -8px rgba(255,107,43,.65); }
.btn-orange:hover { filter: brightness(1.07); }
.btn-outline { border: 1.5px solid rgba(255,255,255,.2); background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.btn-outline:hover { border-color: var(--blue-mid); color: var(--blue-mid); }
.btn-ghost { color: var(--body); font-weight: 600; }
.btn-ghost:hover { color: var(--blue-mid); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .ripple { position: absolute; border-radius: 99px; transform: scale(0); background: rgba(255,255,255,.45);
  animation: ripple .55s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(3.2); opacity: 0; } }
.pulse { animation: pulse 1.7s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,43,.4), 0 8px 22px -8px rgba(255,107,43,.6); }
  55% { box-shadow: 0 0 0 12px rgba(255,107,43,0), 0 8px 22px -8px rgba(255,107,43,.6); } }
.pulse-orange { animation: pulse 1.7s ease-in-out infinite; }

/* ---------- cards & chips ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-sm); }
.card-md { box-shadow: var(--shadow-md); }
.glass { background: rgba(22,22,24,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.14); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 4.5px 12px;
  font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.chip .cdot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.chip-amber { background: var(--amber-soft); color: var(--amber); }
.chip-blue { background: var(--blue-soft); color: var(--blue-mid); }
.chip-purple { background: var(--purple-soft); color: var(--purple); }
.chip-green { background: var(--green-soft); color: var(--green); }
.chip-orange { background: var(--blue-soft); color: var(--blue-mid); }
.chip-grey { background: rgba(255,255,255,.07); color: var(--mute); }
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 99px;
  font-weight: 800; color: #fff; flex: none; }

/* ---------- browser frame ---------- */
.browser { border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,107,43,.28);
  box-shadow: 0 0 0 1px rgba(255,107,43,.08), var(--shadow-lg), 0 0 60px -18px rgba(255,107,43,.3); background: var(--surface); }
.browser-bar { display: flex; align-items: center; gap: 12px; padding: 11px 16px;
  background: linear-gradient(180deg, #1C1C1F, #141416); border-bottom: 1px solid var(--line); }
.bdots { display: flex; gap: 6px; }
.bdots span { width: 11px; height: 11px; border-radius: 99px; }
.url { flex: 1; max-width: 500px; margin: 0 auto; display: flex; align-items: center; gap: 7px;
  background: #0E0E10; border: 1px solid var(--line); border-radius: 8px; padding: 6.5px 12px;
  font-size: 13px; color: var(--body); font-family: var(--mono); }
.browser-body { position: relative; min-height: 520px; background: #101012; }
@media (max-width: 760px) { .browser-body { min-height: 560px; } }

/* ---------- progress / nav ---------- */
.progress-row { display: flex; align-items: center; gap: 14px; }
.pbar { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.pbar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #FF6B2B, #FFB27A); }
.navbar { display: flex; align-items: center; gap: 10px; }

/* ---------- tables / kv ---------- */
.kv { display: grid; grid-template-columns: 100px 1fr; gap: 5px 12px; font-size: 13.5px; }
.kv dt { color: var(--mute); font-weight: 600; }
.kv dd { color: var(--ink); font-weight: 600; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9.5px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.trow:last-child { border-bottom: 0; }

/* ---------- misc ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.shimmer { position: relative; overflow: hidden; }
.shimmer::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.14) 50%, transparent 70%);
  animation: shim 1.4s ease infinite; }
@keyframes shim { from { transform: translateX(-100%);} to { transform: translateX(100%);} }
.hint { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--purple); }
/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .grid2 { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 90px 1fr; }
  /* step layouts are two-column via inline styles — force single column on mobile */
  .s1grid { grid-template-columns: 1fr !important; }
  .navbar { flex-wrap: wrap; justify-content: center !important; row-gap: 10px; }
  .progress-row { flex-wrap: wrap; row-gap: 8px; }
  .url { font-size: 11px; }
  .browser-body { min-height: 480px; }
}
@media (max-width: 480px) {
  .btn { padding: 11px 16px; font-size: 14px; }
  .wrap { padding: 0 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse, .pulse-orange, .shimmer::after { animation: none !important; }
}

</style>
</head>
